<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lesson 6 – localStorage To-Do App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f4f8; padding: 40px 20px; transition: background 0.3s, color 0.3s; }
    body.dark { background: #1a1a2e; color: #eee; }

    h1 { color: #2a5fa5; text-align: center; margin-bottom: 4px; }
    body.dark h1 { color: #85b7eb; }
    .subtitle { text-align: center; color: #888; font-size: 14px; margin-bottom: 24px; }

    .app { max-width: 480px; margin: 0 auto; }

    /* THEME TOGGLE */
    .theme-row { display: flex; justify-content: flex-end; margin-bottom: 16px; }
    .btn-theme {
      background: none; border: 1px solid #ddd; padding: 6px 14px;
      border-radius: 20px; font-size: 13px; cursor: pointer; color: #555;
    }
    body.dark .btn-theme { border-color: #444; color: #ccc; }
    .btn-theme:hover { background: #eee; }
    body.dark .btn-theme:hover { background: #333; }

    /* USER SECTION */
    .user-section {
      background: white; border-radius: 12px; border: 1px solid #ddd;
      padding: 20px; margin-bottom: 16px;
    }
    body.dark .user-section { background: #16213e; border-color: #333; }
    .user-section h2 { font-size: 15px; margin-bottom: 10px; color: #333; }
    body.dark .user-section h2 { color: #eee; }
    .user-row { display: flex; gap: 8px; }
    .user-row input {
      flex: 1; padding: 8px 12px; border: 1px solid #ddd; border-radius: 7px;
      font-size: 14px; outline: none; background: white;
    }
    body.dark .user-row input { background: #222; border-color: #444; color: #eee; }
    .welcome-msg { font-size: 15px; color: #2a5fa5; font-weight: bold; }
    body.dark .welcome-msg { color: #85b7eb; }

    /* TASK SECTION */
    .task-section {
      background: white; border-radius: 12px; border: 1px solid #ddd; padding: 20px;
    }
    body.dark .task-section { background: #16213e; border-color: #333; }
    .input-row { display: flex; gap: 8px; margin-bottom: 16px; }
    .input-row input {
      flex: 1; padding: 10px 12px; border: 1px solid #ddd; border-radius: 7px;
      font-size: 15px; outline: none;
    }
    body.dark .input-row input { background: #222; border-color: #444; color: #eee; }
    button.btn-add {
      background: #2a5fa5; color: white; border: none;
      padding: 10px 18px; border-radius: 7px; font-size: 15px; cursor: pointer;
    }
    button.btn-add:hover { background: #1e4a87; }

    /* TASK ITEMS */
    .task-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 0; border-bottom: 1px solid #f0f0f0;
    }
    body.dark .task-item { border-color: #333; }
    .task-item:last-child { border-bottom: none; }
    .task-item.done .task-text { text-decoration: line-through; color: #bbb; }
    .task-text { flex: 1; font-size: 15px; color: #333; cursor: pointer; }
    body.dark .task-text { color: #ddd; }
    input[type="checkbox"] { width: 18px; height: 18px; accent-color: #2a5fa5; cursor: pointer; }
    .btn-del {
      background: none; border: none; color: #ccc; font-size: 18px;
      cursor: pointer; line-height: 1; padding: 0 2px;
    }
    .btn-del:hover { color: #e74c3c; }
    .empty { text-align: center; padding: 30px; color: #ccc; font-size: 14px; }

    /* STATS */
    .stats { display: flex; gap: 10px; margin-bottom: 14px; }
    .stat { flex: 1; background: #f0f4f8; border-radius: 8px; padding: 10px; text-align: center; }
    body.dark .stat { background: #0f3460; }
    .stat-num { font-size: 22px; font-weight: bold; color: #2a5fa5; }
    body.dark .stat-num { color: #85b7eb; }
    .stat-label { font-size: 12px; color: #888; }

    .bottom-row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 13px; color: #888; }
    .btn-clear { background: none; border: none; color: #e74c3c; font-size: 13px; cursor: pointer; }
    .btn-clear:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <h1>Smart To-Do App</h1>
  <p class="subtitle">Lesson 6 — localStorage. Refresh the page — your tasks are saved!</p>

  <div class="app">

    <div class="theme-row">
      <button class="btn-theme" id="themeBtn" onclick="toggleTheme()">Dark mode</button>
    </div>

    <!-- USER GREETING SECTION -->
    <div class="user-section">
      <div id="nameSection">
        <h2>Who are you?</h2>
        <div class="user-row">
          <input type="text" id="nameInput" placeholder="Enter your name">
          <button class="btn-add" onclick="saveName()">Save</button>
        </div>
      </div>
      <div id="welcomeSection" style="display:none;">
        <span class="welcome-msg" id="welcomeMsg"></span>
        <button onclick="logout()" style="margin-left:12px;background:none;border:none;color:#888;font-size:13px;cursor:pointer;">Log out</button>
      </div>
    </div>

    <!-- TASK SECTION -->
    <div class="task-section">
      <div class="stats">
        <div class="stat"><div class="stat-num" id="totalCount">0</div><div class="stat-label">Total</div></div>
        <div class="stat"><div class="stat-num" id="doneCount">0</div><div class="stat-label">Done</div></div>
        <div class="stat"><div class="stat-num" id="leftCount">0</div><div class="stat-label">Left</div></div>
      </div>

      <div class="input-row">
        <input type="text" id="taskInput" placeholder="Add a new task...">
        <button class="btn-add" id="addBtn">Add</button>
      </div>

      <div id="taskList"></div>

      <div class="bottom-row">
        <span id="summaryText"></span>
        <button class="btn-clear" onclick="clearDone()">Clear completed</button>
      </div>
    </div>
  </div>

  <script>
    /* ================================
       LOAD SAVED DATA
    ================================ */
    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
    let dark  = localStorage.getItem("dark") === "true";
    let savedName = localStorage.getItem("username") || "";

    /* ================================
       THEME
    ================================ */
    if (dark) {
      document.body.classList.add("dark");
      document.getElementById("themeBtn").textContent = "Light mode";
    }

    function toggleTheme() {
      dark = !dark;
      document.body.classList.toggle("dark");
      document.getElementById("themeBtn").textContent = dark ? "Light mode" : "Dark mode";
      localStorage.setItem("dark", dark); // save preference!
    }

    /* ================================
       USER NAME
    ================================ */
    if (savedName) showWelcome(savedName);

    function saveName() {
      let name = document.getElementById("nameInput").value.trim();
      if (name === "") { alert("Please enter your name!"); return; }
      localStorage.setItem("username", name);
      showWelcome(name);
    }

    function showWelcome(name) {
      document.getElementById("nameSection").style.display = "none";
      document.getElementById("welcomeSection").style.display = "block";
      document.getElementById("welcomeMsg").textContent = "Welcome back, " + name + "!";
    }

    function logout() {
      localStorage.removeItem("username");
      document.getElementById("nameSection").style.display = "block";
      document.getElementById("welcomeSection").style.display = "none";
      document.getElementById("nameInput").value = "";
    }

    /* ================================
       TASKS
    ================================ */
    function saveTasks() {
      localStorage.setItem("tasks", JSON.stringify(tasks)); // save every time!
    }

    function addTask() {
      let input = document.getElementById("taskInput");
      let text  = input.value.trim();
      if (text === "") { alert("Enter a task first!"); return; }
      tasks.push({ id: Date.now(), text: text, done: false });
      input.value = "";
      input.focus();
      saveTasks(); // save immediately
      render();
    }

    function toggleTask(id) {
      tasks = tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
      saveTasks();
      render();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      render();
    }

    function clearDone() {
      tasks = tasks.filter(t => !t.done);
      saveTasks();
      render();
    }

    function render() {
      let list = document.getElementById("taskList");
      if (tasks.length === 0) {
        list.innerHTML = '<div class="empty">No tasks yet — add one above!</div>';
      } else {
        list.innerHTML = tasks.map(t => `
          <div class="task-item ${t.done ? "done" : ""}">
            <input type="checkbox" ${t.done ? "checked" : ""} onchange="toggleTask(${t.id})">
            <span class="task-text" onclick="toggleTask(${t.id})">${t.text}</span>
            <button class="btn-del" onclick="deleteTask(${t.id})">&#x2715;</button>
          </div>
        `).join("");
      }
      // Update stats
      let total = tasks.length;
      let done  = tasks.filter(t => t.done).length;
      let left  = total - done;
      document.getElementById("totalCount").textContent = total;
      document.getElementById("doneCount").textContent  = done;
      document.getElementById("leftCount").textContent  = left;
      document.getElementById("summaryText").textContent = left + " task" + (left !== 1 ? "s" : "") + " remaining";
    }

    /* ================================
       EVENT LISTENERS
    ================================ */
    document.getElementById("addBtn").addEventListener("click", addTask);
    document.getElementById("taskInput").addEventListener("keydown", e => {
      if (e.key === "Enter") addTask();
    });

    render(); // initial render

    /*
      CHALLENGE: Try these yourself!
      1. Add a "priority" label (high/low) to each task and save it
      2. Add a filter: show All / Active / Done (save the filter choice!)
      3. Add a sort button that sorts tasks alphabetically
      4. Save a theme colour preference (e.g. blue, green, red)
    */
  </script>
</body>
</html>
