<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lesson 6 – localStorage</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,sans-serif;background:#f0f4f8;padding:40px 20px;transition:background 0.3s,color 0.3s;}
body.dark{background:#1a1a2e;color:#eee;}
h1{color:#2a5fa5;text-align:center;margin-bottom:4px;}
body.dark h1{color:#85b7eb;}
.subtitle{text-align:center;color:#888;font-size:14px;margin-bottom:24px;}
.app{max-width:480px;margin:0 auto;}

/* theme button */
.top-row{display:flex;justify-content:flex-end;margin-bottom:14px;}
.btn-theme{background:none;border:1px solid #ddd;padding:6px 14px;
  border-radius:20px;font-size:13px;cursor:pointer;color:#555;}
body.dark .btn-theme{border-color:#444;color:#ccc;}

/* user section */
.section{background:white;border-radius:12px;border:1px solid #ddd;padding:20px;margin-bottom:14px;}
body.dark .section{background:#16213e;border-color:#333;}
.section h2{font-size:15px;margin-bottom:10px;color:#333;}
body.dark .section h2{color:#eee;}
.row{display:flex;gap:8px;}
.row input,#taskInput{flex:1;padding:9px 12px;border:1px solid #ddd;
  border-radius:7px;font-size:14px;outline:none;background:white;}
body.dark .row input, body.dark #taskInput{background:#222;border-color:#444;color:#eee;}
.welcome{font-size:15px;color:#2a5fa5;font-weight:bold;}
body.dark .welcome{color:#85b7eb;}
.link-btn{background:none;border:none;color:#888;font-size:13px;cursor:pointer;margin-left:10px;}

/* stats */
.stats{display:flex;gap:10px;margin-bottom:14px;}
.stat{flex:1;background:#f0f4f8;border-radius:8px;padding:10px;text-align:center;}
body.dark .stat{background:#0f3460;}
.stat-n{font-size:22px;font-weight:bold;color:#2a5fa5;}
body.dark .stat-n{color:#85b7eb;}
.stat-l{font-size:12px;color:#888;}

/* input row */
.input-row{display:flex;gap:8px;margin-bottom:14px;}
.btn-add{background:#2a5fa5;color:white;border:none;padding:10px 18px;
  border-radius:7px;font-size:15px;cursor:pointer;}
.btn-add:hover{background:#1e4a87;}

/* tasks */
.task{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #f0f0f0;}
body.dark .task{border-color:#333;}
.task:last-child{border-bottom:none;}
.task.done .task-text{text-decoration:line-through;color:#bbb;}
.task-text{flex:1;font-size:15px;color:#333;cursor:pointer;}
body.dark .task-text{color:#ddd;}
input[type="checkbox"]{width:18px;height:18px;accent-color:#2a5fa5;cursor:pointer;}
.btn-del{background:none;border:none;color:#ccc;font-size:18px;cursor:pointer;line-height:1;}
.btn-del:hover{color:#e74c3c;}
.empty{text-align:center;padding:28px;color:#ccc;font-size:14px;}

/* bottom */
.bottom{display:flex;justify-content:space-between;align-items:center;
  margin-top:10px;font-size:13px;color:#888;}
.btn-clear{background:none;border:none;color:#e74c3c;font-size:13px;cursor:pointer;}
.btn-clear:hover{text-decoration:underline;}
</style>
</head>
<body>

<h1>Smart To-Do App</h1>
<p class="subtitle">Lesson 6 — Refresh the page. Your tasks stay!</p>

<div class="app">

  <div class="top-row">
    <button class="btn-theme" id="themeBtn" onclick="toggleTheme()">Dark mode</button>
  </div>

  <!-- USER -->
  <div class="section">
    <div id="nameSection">
      <h2>Who are you?</h2>
      <div class="row">
        <input type="text" id="nameInput" placeholder="Enter your name">
        <button class="btn-add" onclick="saveName()">Save</button>
      </div>
    </div>
    <div id="welcomeSection" style="display:none;">
      <span class="welcome" id="welcomeMsg"></span>
      <button class="link-btn" onclick="logout()">Log out</button>
    </div>
  </div>

  <!-- TASKS -->
  <div class="section">
    <div class="stats">
      <div class="stat"><div class="stat-n" id="totalN">0</div><div class="stat-l">Total</div></div>
      <div class="stat"><div class="stat-n" id="doneN">0</div><div class="stat-l">Done</div></div>
      <div class="stat"><div class="stat-n" id="leftN">0</div><div class="stat-l">Left</div></div>
    </div>
    <div class="input-row">
      <input type="text" id="taskInput" placeholder="Add a task... (press Enter)">
      <button class="btn-add" id="addBtn">Add</button>
    </div>
    <div id="taskList"></div>
    <div class="bottom">
      <span id="summary"></span>
      <button class="btn-clear" onclick="clearDone()">Clear completed</button>
    </div>
  </div>

</div>

<script>
  /* =====================
     LOAD FROM LOCALSTORAGE
  ===================== */
  let tasks = JSON.parse(localStorage.getItem("ls_tasks")) || [];
  let dark  = localStorage.getItem("ls_dark") === "true";
  let savedName = localStorage.getItem("ls_username") || "";

  /* =====================
     DARK MODE
  ===================== */
  if (dark) applyDark();

  function toggleTheme() {
    dark = !dark;
    localStorage.setItem("ls_dark", dark);
    if (dark) applyDark(); else removeDark();
  }
  function applyDark() {
    document.body.classList.add("dark");
    document.getElementById("themeBtn").textContent = "Light mode";
  }
  function removeDark() {
    document.body.classList.remove("dark");
    document.getElementById("themeBtn").textContent = "Dark mode";
  }

  /* =====================
     USER NAME
  ===================== */
  if (savedName) showWelcome(savedName);

  function saveName() {
    let n = document.getElementById("nameInput").value.trim();
    if (!n) { alert("Please enter your name!"); return; }
    localStorage.setItem("ls_username", n);
    showWelcome(n);
  }
  function showWelcome(n) {
    document.getElementById("nameSection").style.display = "none";
    document.getElementById("welcomeSection").style.display = "block";
    document.getElementById("welcomeMsg").textContent = "Welcome back, " + n + "!";
  }
  function logout() {
    localStorage.removeItem("ls_username");
    document.getElementById("nameSection").style.display = "block";
    document.getElementById("welcomeSection").style.display = "none";
    document.getElementById("nameInput").value = "";
  }

  /* =====================
     TASKS
  ===================== */
  function save() {
    // Always call save() after any change to tasks
    localStorage.setItem("ls_tasks", JSON.stringify(tasks));
  }

  function addTask() {
    let input = document.getElementById("taskInput");
    let text  = input.value.trim();
    if (!text) { alert("Please enter a task!"); return; }
    tasks.push({ id: Date.now(), text: text, done: false });
    input.value = "";
    input.focus();
    save();   // save immediately after adding
    render();
  }

  function toggleTask(id) {
    tasks = tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
    save();
    render();
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    save();
    render();
  }

  function clearDone() {
    tasks = tasks.filter(t => !t.done);
    save();
    render();
  }

  function render() {
    let list = document.getElementById("taskList");
    if (tasks.length === 0) {
      list.innerHTML = '<div class="empty">No tasks yet — add one above!</div>';
    } else {
      list.innerHTML = tasks.map(t => `
        <div class="task ${t.done ? "done" : ""}">
          <input type="checkbox" ${t.done ? "checked" : ""} onchange="toggleTask(${t.id})">
          <span class="task-text" onclick="toggleTask(${t.id})">${t.text}</span>
          <button class="btn-del" onclick="deleteTask(${t.id})">&#x2715;</button>
        </div>
      `).join("");
    }
    let total = tasks.length;
    let done  = tasks.filter(t => t.done).length;
    let left  = total - done;
    document.getElementById("totalN").textContent = total;
    document.getElementById("doneN").textContent  = done;
    document.getElementById("leftN").textContent  = left;
    document.getElementById("summary").textContent = left + " task" + (left !== 1 ? "s" : "") + " remaining";
  }

  document.getElementById("addBtn").addEventListener("click", addTask);
  document.getElementById("taskInput").addEventListener("keydown", e => {
    if (e.key === "Enter") addTask();
  });

  render(); // show tasks on load

  /*
    CHALLENGE:
    1. Add a "priority" tag (high/low) to each task and save it
    2. Add All / Active / Done filter tabs (save the active filter!)
    3. Add a task count badge in the page title: document.title
    4. Let the user change the app's accent colour and save it
  */
</script>
</body>
</html>
