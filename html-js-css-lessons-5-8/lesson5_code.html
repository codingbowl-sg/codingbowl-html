<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lesson 5 – Sign Up Form</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,sans-serif;background:#f0f4f8;padding:40px 20px;}
h1{color:#2a5fa5;text-align:center;margin-bottom:4px;}
.subtitle{text-align:center;color:#888;font-size:14px;margin-bottom:28px;}
.card{background:white;border-radius:12px;border:1px solid #ddd;padding:28px;max-width:420px;margin:0 auto;}
label{display:block;font-size:14px;font-weight:bold;color:#444;margin-bottom:4px;}
input[type="text"],input[type="email"],input[type="password"],input[type="number"]{
  display:block;width:100%;padding:10px 12px;border:1px solid #ddd;
  border-radius:7px;font-size:15px;margin-bottom:4px;outline:none;transition:border-color 0.2s;
}
input:focus{border-color:#2a5fa5;}
input.invalid{border-color:#e74c3c;}
input.valid{border-color:#27ae60;}
.err{font-size:12px;color:#e74c3c;min-height:18px;margin-bottom:10px;}
.pw-wrap{position:relative;}
.pw-wrap button{
  position:absolute;right:10px;top:10px;background:none;
  border:none;color:#888;font-size:13px;cursor:pointer;
}
.radio-group{display:flex;gap:20px;margin:6px 0 4px;}
.radio-group label{font-weight:normal;display:flex;align-items:center;gap:6px;}
.check-row{display:flex;align-items:center;gap:10px;margin:8px 0 4px;}
.check-row input{width:auto;margin:0;}
.check-row label{margin:0;font-weight:normal;}
.btn{width:100%;background:#2a5fa5;color:white;border:none;padding:12px;
  border-radius:7px;font-size:16px;cursor:pointer;margin-top:8px;}
.btn:hover{background:#1e4a87;}
.success{display:none;background:#d5f5e3;border:1px solid #27ae60;
  border-radius:10px;padding:24px;text-align:center;color:#1a6b3a;
  font-size:16px;max-width:420px;margin:0 auto;}
</style>
</head>
<body>

<h1>Create an account</h1>
<p class="subtitle">Lesson 5 — HTML Forms &amp; Validation</p>

<div class="card" id="formCard">

  <label for="fullName">Full name</label>
  <input type="text" id="fullName" placeholder="e.g. Sarah Tan" oninput="clearErr('fullName')">
  <div class="err" id="fullNameErr"></div>

  <label for="email">Email address</label>
  <input type="email" id="email" placeholder="e.g. sarah@gmail.com" oninput="clearErr('email')">
  <div class="err" id="emailErr"></div>

  <label for="password">Password</label>
  <div class="pw-wrap">
    <input type="password" id="password" placeholder="Min 6 characters" oninput="clearErr('password')">
    <button type="button" onclick="togglePw('password',this)">Show</button>
  </div>
  <div class="err" id="passwordErr"></div>

  <label for="confirm">Confirm password</label>
  <div class="pw-wrap">
    <input type="password" id="confirm" placeholder="Re-enter password" oninput="clearErr('confirm')">
    <button type="button" onclick="togglePw('confirm',this)">Show</button>
  </div>
  <div class="err" id="confirmErr"></div>

  <label>Gender</label>
  <div class="radio-group">
    <label><input type="radio" name="gender" value="female"> Female</label>
    <label><input type="radio" name="gender" value="male"> Male</label>
    <label><input type="radio" name="gender" value="other"> Other</label>
  </div>
  <div class="err" id="genderErr"></div>

  <div class="check-row">
    <input type="checkbox" id="terms" onchange="clearErr('terms')">
    <label for="terms">I agree to the Terms and Conditions</label>
  </div>
  <div class="err" id="termsErr"></div>

  <button class="btn" type="button" onclick="submitForm()">Create account</button>
</div>

<div class="success" id="successBanner"></div>

<script>
  // ---- helpers ----
  function showErr(id, msg) {
    document.getElementById(id + "Err").textContent = msg;
    let el = document.getElementById(id);
    if (el) { el.classList.add("invalid"); el.classList.remove("valid"); }
  }
  function clearErr(id) {
    document.getElementById(id + "Err").textContent = "";
    let el = document.getElementById(id);
    if (el) el.classList.remove("invalid");
  }
  function markValid(id) {
    let el = document.getElementById(id);
    if (el) { el.classList.add("valid"); el.classList.remove("invalid"); }
  }
  function togglePw(id, btn) {
    let el = document.getElementById(id);
    el.type = el.type === "password" ? "text" : "password";
    btn.textContent = el.type === "password" ? "Show" : "Hide";
  }

  // ---- validation ----
  function submitForm() {
    let ok = true;

    let name = document.getElementById("fullName").value.trim();
    if (name === "") { showErr("fullName", "Full name is required."); ok = false; }
    else markValid("fullName");

    let email = document.getElementById("email").value.trim();
    if (email === "") { showErr("email", "Email is required."); ok = false; }
    else if (!email.includes("@") || !email.includes(".")) {
      showErr("email", "Enter a valid email address."); ok = false;
    } else markValid("email");

    let pw = document.getElementById("password").value;
    if (pw.length < 6) { showErr("password", "Password must be at least 6 characters."); ok = false; }
    else markValid("password");

    let cf = document.getElementById("confirm").value;
    if (cf !== pw) { showErr("confirm", "Passwords do not match."); ok = false; }
    else if (cf !== "") markValid("confirm");

    if (!document.querySelector('input[name="gender"]:checked')) {
      showErr("gender", "Please select a gender."); ok = false;
    }

    if (!document.getElementById("terms").checked) {
      showErr("terms", "You must agree to the terms."); ok = false;
    }

    if (ok) {
      document.getElementById("formCard").style.display = "none";
      let b = document.getElementById("successBanner");
      b.style.display = "block";
      b.textContent = "Account created! Welcome, " + name + "!";
      localStorage.setItem("username", name); // save for Lesson 6!
    }
  }

  /*
    CHALLENGE:
    1. Add an age number field — must be 13 or older
    2. Show password strength indicator (weak / medium / strong)
    3. Add a username field — no spaces allowed (hint: .includes(" "))
    4. After success, redirect to a welcome page after 3 seconds
  */
</script>
</body>
</html>
