<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lesson 1 – About Me</title>
  <style>
    /* ================================
       LESSON 1: HTML & CSS
       Try changing these values!
    ================================ */

    body {
      font-family: Arial, sans-serif;
      background-color: #f0f4f8;
      margin: 0;
      padding: 40px 20px;
    }

    h1 {
      color: #2a5fa5;
      text-align: center;
    }

    h2 {
      color: #444;
    }

    /* A CSS class — starts with a dot */
    .card {
      background: white;
      border-radius: 12px;
      border: 1px solid #ddd;
      padding: 24px;
      max-width: 500px;
      margin: 20px auto;
    }

    .highlight {
      color: #2a5fa5;
      font-weight: bold;
    }

    p {
      font-size: 16px;
      color: #555;
      line-height: 1.7;
    }

    ul {
      color: #555;
      line-height: 2;
    }

    a {
      color: #2a5fa5;
    }

    .tag {
      display: inline-block;
      background: #e6f1fb;
      color: #0c447c;
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 14px;
      margin: 4px 2px;
    }
  </style>
</head>
<body>

  <h1>About Me</h1>

  <div class="card">
    <h2>Hi, I'm <span class="highlight">Sarah</span>!</h2>

    <p>I am a first-year student studying
      <span class="highlight">IT Applications Development</span>
      at ITE. I love technology and creating things.
    </p>

    <h2>My Hobbies</h2>
    <ul>
      <li>Watching anime</li>
      <li>Playing mobile games</li>
      <li>Learning to code</li>
    </ul>

    <h2>My Favourite Sites</h2>
    <p>
      <a href="https://www.youtube.com" target="_blank">YouTube</a> |
      <a href="https://www.github.com" target="_blank">GitHub</a>
    </p>

    <h2>Skills I'm Learning</h2>
    <span class="tag">HTML</span>
    <span class="tag">CSS</span>
    <span class="tag">JavaScript</span>
    <span class="tag">Java</span>
  </div>

  <!--
    CHALLENGE: Try these yourself!
    1. Change the background-color of body
    2. Change the font-family to "Georgia"
    3. Add another hobby to the list
    4. Add a border to the .card: border: 2px solid blue;
    5. Add your own .tag with a different colour
  -->

</body>
</html>
